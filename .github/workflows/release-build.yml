name: Release build

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROJECT_VERSION=${{ github.ref_name }} \
            -DPROJECT_VERSION_SUFFIX=""

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: build/test
        run: |
          set -e
          shopt -s nullglob
          tests=(test_*)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No test executables found" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            [ -x "$t" ] || continue
            echo "::group::$t"
            "./$t"
            echo "::endgroup::"
          done

      - name: Stage release artifacts
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          OUT="staging"
          mkdir -p "$OUT"

          # CMake's mc_versioned_copy() already produced files named
          # lib<name>-<arch>-<tag>.a and test_<name>-<arch>-<tag>.
          find build/src  -type f -name "lib*-*-${TAG}.a"  -exec cp {} "$OUT/" \;
          find build/test -type f -name "test_*-*-${TAG}" -exec cp {} "$OUT/" \;

          echo "Staged files:"
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcore-${{ matrix.arch }}-${{ github.ref_name }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mcore-*
          merge-multiple: true

      - name: List release files
        run: ls -la artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
